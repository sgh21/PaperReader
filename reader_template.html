<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,">
<title>{{PAGE_TITLE}}</title><style>
:root{color-scheme:light;--ink:#202731;--muted:#77818c;--accent:#5666bf;--line:#e6e9ed;--paper:#fff;--bg:#f3f4f7}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
a{color:#5368c7;text-decoration:none}a:hover{text-decoration:underline}header.top{height:58px;background:#202631;color:#fff;display:flex;align-items:center;padding:0 28px;gap:12px;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px #1112}.logo{width:27px;height:27px;border-radius:8px;background:#697bea;display:grid;place-items:center;font-weight:800}.brand{font-weight:700;letter-spacing:.02em}.top-sub{color:#aeb6c4;font-size:13px;margin-left:3px}.controls{margin-left:auto;display:flex;gap:5px;background:#323a48;border-radius:8px;padding:3px}.controls button{background:transparent;color:#c2c9d4;border:0;border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit;font-size:12px}.controls button.active{background:#6574d2;color:#fff}

.figure{margin:30px 0 36px;padding:20px;border:1px solid #e8eaf0;border-radius:9px;background:#fafbfc;scroll-margin-top:78px}.figure-title{display:flex;justify-content:space-between;align-items:center;gap:15px;font:600 14px Georgia,serif;margin-bottom:16px}.figure-title b{font:600 12px system-ui;color:#71809b;margin-left:7px}.figure-title small{font:11px system-ui;color:#9aa4b0}.figure img{display:block;max-width:100%;max-height:850px;width:auto;height:auto;margin:0 auto;border:1px solid #edf0f3}.figure figcaption{margin-top:17px;padding-top:15px;border-top:1px solid #e7ebef;font-size:13px}.figure figcaption .zh{margin-top:12px;color:#3f506b}.transcribed-table{margin-top:22px}.transcribed-table h4{font-size:13px;color:#61708a}.table-scroll{overflow-x:auto;border:1px solid #e8ebf0;border-radius:6px;background:#fff}table{border-collapse:collapse;width:100%;font-size:12px;line-height:1.5}th,td{padding:8px 10px;border-bottom:1px solid #edf0f3;text-align:left;white-space:nowrap}th{background:#f2f4f9;color:#52617a;font-weight:700}tr:last-child td{border-bottom:0}.endnote{margin-top:46px;padding:20px 23px;background:#f6f7fb;border-radius:8px;font-size:13px;color:#687586;line-height:1.8}.endnote h2{font-size:17px;color:#394454;margin:0 0 12px}.endnote li+li{margin-top:6px}.glossary{margin-top:40px}.glossary h2{font-size:20px}.footer{margin-top:42px;color:#a0a9b4;font-size:11px;border-top:1px solid var(--line);padding-top:15px}

</style></head><body data-mode="both"><header class="top"><div class="logo">R</div><div class="brand">Paper Reader</div><div class="top-sub">中英文对照</div><div class="controls" role="group" aria-label="阅读语言"><button data-mode="both" class="active">双语</button><button data-mode="zh">中文</button><button data-mode="en">English</button></div></header><div class="layout"><nav class="sidebar" aria-label="文章目录"><div class="sidebar-title">CONTENTS / 目录</div>{{TOC}}</nav><main class="paper"><div class="eyebrow">BILINGUAL PAPER READER</div><h1>{{TITLE_EN}}</h1><div class="title-zh">{{TITLE_ZH}}</div><div class="authors">{{AUTHORS}}</div><div class="document-meta">{{META}}</div><p class="intro-note">原文段落后紧接中文译文，页码与编号可用于回查原始 PDF；图表按照相关内容重新放置。</p>{{CONTENT}}{{EXTRAS}}<div class="footer">由用户提供的论文 PDF 整理 · 源位置标注对应原 PDF 页码</div></main></div><script>document.querySelectorAll('.controls button').forEach(button=>button.addEventListener('click',()=>{document.body.dataset.mode=button.dataset.mode;document.querySelectorAll('.controls button').forEach(b=>b.classList.toggle('active',b===button));}));</script></body></html>
